name: Observability self-test

# Dogfoods the bundled composite Action against this repository's own example
# telemetry on every push and PR, proving the Action's command path stays green.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the Observability Report Card on bundled fixtures
        uses: ./
        with:
          path: examples/microservices
          fail-on: never
          comment: ${{ github.event_name == 'pull_request' }}
          upload-sarif: "false"
