[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-contracts"
version = "0.1.0"
description = "Test observability as a correctness property — starting from the telemetry you already have."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Telemetry Contracts Prototype"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Logging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thehalleyyoung/telemetry-contract-semantics"
Repository = "https://github.com/thehalleyyoung/telemetry-contract-semantics"
Issues = "https://github.com/thehalleyyoung/telemetry-contract-semantics/issues"
Documentation = "https://github.com/thehalleyyoung/telemetry-contract-semantics#readme"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=7"]

[project.scripts]
telemetry-contracts = "telemetry_contracts.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["telemetry_contracts*"]
exclude = ["case_studies*", "docs*", "examples*", "reports*", "tests*", "benchmarks*"]
