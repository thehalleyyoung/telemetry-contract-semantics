<svg xmlns="http://www.w3.org/2000/svg" width="634" height="344" viewBox="0 0 634 344" role="img" aria-label="telemetry-contracts scan-repo demo"><rect width="634" height="344" rx="8" fill="#0d1117"/><rect width="634" height="28" rx="8" fill="#161b22"/><rect y="20" width="634" height="8" fill="#161b22"/><circle cx="18" cy="14" r="5" fill="#f85149"/><circle cx="36" cy="14" r="5" fill="#d29922"/><circle cx="54" cy="14" r="5" fill="#3fb950"/><text x="317" y="18" fill="#8b949e" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="11" text-anchor="middle">telemetry-contracts scan-repo</text><g font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="12"><text x="16" y="55" fill="#3fb950">$</text><text x="30" y="55" fill="#e6edf3">telemetry-contracts scan-repo --repo almbayedahmad/medflux</text><text x="16" y="73" fill="#8b949e">Scanned https://github.com/almbayedahmad/medflux.git: 5 telemetry file(s), 61 event(s), 4 finding(s) (0 error, 4 warning).</text><text x="16" y="91" fill="#8b949e"></text><text x="16" y="109" fill="#8b949e">Top issue types:</text><text x="16" y="127" fill="#d29922">  warning telemetry.correlation_missing     2</text><text x="16" y="145" fill="#d29922">  warning telemetry.sensitive_unclassified  2</text><text x="16" y="163" fill="#8b949e"></text><text x="16" y="181" fill="#8b949e">Findings (most severe first):</text><text x="16" y="199" fill="#d29922">  WARNING telemetry.correlation_missing in logs/current.jsonl at event[1]:</text><text x="16" y="217" fill="#8b949e">          log 'medflux.uncaught' reports a failure but carries no correlation id</text><text x="16" y="235" fill="#d29922">  WARNING telemetry.sensitive_unclassified at event[1].tenantID:</text><text x="16" y="253" fill="#8b949e">          field 'tenantID' is emitted without redaction/hashing or a classification</text><text x="16" y="271" fill="#8b949e"></text><text x="16" y="289" fill="#8b949e">Next steps:</text><text x="16" y="307" fill="#8b949e">  - Understand a finding:  telemetry-contracts explain telemetry.correlation_missing</text><text x="16" y="325" fill="#8b949e">  - Lock it in:            telemetry-contracts infer-contract --events logs/current.jsonl</text></g></svg>